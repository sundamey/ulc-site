<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Université Loyola du Congo · Kinshasa</title>
<meta name="description" content="Université Loyola du Congo (ULC), Kinshasa — admissions, recherche et Fonds du nouveau bâtiment de la Faculté de Philosophie." />

<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16x16.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<body>

<!-- =========================== RECTOR RIBBON ========================= -->
<div class="rector-ribbon">
  <div class="mx-auto max-w-content px-5 py-2.5 text-center text-sm">
    <span data-i18n="ribbon.rector"></span>
    <a href="#rector" class="ml-1 font-semibold" data-i18n="ribbon.link"></a>
  </div>
</div>

<!-- ============================ NAVIGATION ============================ -->
<header class="sticky top-0 z-40 border-b border-line bg-black/90 backdrop-blur">
  <nav class="mx-auto flex max-w-content items-center justify-between px-5 py-4" aria-label="Primary">
    <a href="#top" class="flex items-center gap-3">
      <img src="assets/img/ulc-logo.png" alt="" class="brand-mark" width="40" height="40" />
      <span class="leading-tight">
        <span class="block text-sm font-extrabold text-white" data-i18n="brand.line1">Université Loyola</span>
        <span class="block text-[11px] uppercase tracking-eyebrow text-muted" data-i18n="brand.line2">du Congo · Kinshasa</span>
      </span>
    </a>

    <div class="flex items-center gap-4">
      <ul class="hidden items-center gap-8 text-sm font-medium md:flex">
        <li><a class="transition-colors hover:text-gold" href="#admissions" data-i18n="nav.admissions">Admissions</a></li>
        <li><a class="transition-colors hover:text-gold" href="#research" data-i18n="nav.research">Pôle Recherche</a></li>
        <li><a class="transition-colors hover:text-gold" href="#give" data-i18n="nav.give">Faire un don</a></li>
        <li><a class="btn-gold btn-sm" href="#admissions" data-i18n="nav.apply">Postuler</a></li>
      </ul>

      <!-- Language switch -->
      <div class="lang-switch" role="group" data-i18n-aria-label="nav.langLabel">
        <button type="button" data-lang-btn="fr" aria-pressed="true">FR</button>
        <button type="button" data-lang-btn="en" aria-pressed="false">EN</button>
      </div>

      <button id="navToggle" class="rounded-md p-2 md:hidden" aria-expanded="false" aria-controls="mobileMenu">
        <svg id="iconOpen" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round"/>
        </svg>
        <svg id="iconClose" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" hidden>
          <path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </nav>

  <div id="mobileMenu" class="fixed inset-0 top-[65px] z-30 bg-black/95 backdrop-blur md:hidden" hidden>
    <ul class="flex flex-col gap-2 px-6 pt-8 text-lg font-medium">
      <li><a class="block border-b border-line py-4 hover:text-gold" href="#admissions" data-nav data-i18n="nav.admissions">Admissions</a></li>
      <li><a class="block border-b border-line py-4 hover:text-gold" href="#research" data-nav data-i18n="nav.research">Pôle Recherche</a></li>
      <li><a class="block border-b border-line py-4 hover:text-gold" href="#give" data-nav data-i18n="nav.give">Faire un don</a></li>
      <li class="pt-6"><a class="btn-gold w-full" href="#admissions" data-nav data-i18n="nav.apply">Postuler</a></li>
    </ul>
  </div>
</header>

<main id="top">

<!-- ============================== HERO =============================== -->
<section class="relative overflow-hidden border-b border-line">
  <svg class="pointer-events-none absolute -right-40 -top-40 h-[560px] w-[560px] opacity-[0.14]" viewBox="0 0 400 400" fill="none" aria-hidden="true">
    <g stroke="#FFD700" stroke-width="0.8">
      <circle cx="200" cy="200" r="70"/><circle cx="200" cy="200" r="120"/><circle cx="200" cy="200" r="170"/>
      <path d="M200 10v380M10 200h380M65 65l270 270M335 65L65 335M200 10 335 335M200 10 65 335M10 200 335 65M10 200 335 335"/>
    </g>
  </svg>

  <div class="relative mx-auto max-w-content px-5 py-24 md:py-32">
    <p class="eyebrow mb-4" data-i18n="hero.eyebrow"></p>
    <h1 class="max-w-3xl text-4xl font-extrabold leading-tight text-white md:text-6xl">
      <span data-i18n="hero.title"></span>
      <span class="text-gold" data-i18n="hero.titleAccent"></span>
    </h1>
    <p class="mt-6 max-w-2xl text-lg text-body/90" data-i18n="hero.lead"></p>
    <div class="mt-10 flex flex-wrap gap-4">
      <a class="btn-gold" href="#admissions" data-i18n="hero.ctaApply"></a>
      <a class="btn-ghost" href="#research" data-i18n="hero.ctaResearch"></a>
    </div>

    <dl class="mt-16 grid max-w-2xl grid-cols-3 gap-6 border-t border-line pt-8">
      <div><dt class="text-sm text-muted" data-i18n="hero.statFaculties"></dt><dd class="text-2xl font-extrabold text-white">3</dd></div>
      <div><dt class="text-sm text-muted" data-i18n="hero.statProjects"></dt><dd class="text-2xl font-extrabold text-white">40+</dd></div>
      <div><dt class="text-sm text-muted" data-i18n="hero.statPartners"></dt><dd class="text-2xl font-extrabold text-white">18</dd></div>
    </dl>
  </div>
</section>


<!-- ========================= RECTOR WELCOME ========================== -->
<!-- DRAFT COPY. The first-person text below was written as a starting
     point, not by Fr. Lentiampa. It must be replaced with his own words,
     or approved by him in writing, before this page goes live. -->
<section id="rector" class="rector-band border-b border-line">
  <div class="mx-auto max-w-content px-5 py-20 md:py-28">
    <div class="grid items-center gap-10 md:grid-cols-5 md:gap-14">

      <figure class="md:col-span-2">
        <picture>
          <source type="image/webp"
                  srcset="assets/img/rector-320.webp 320w,
                          assets/img/rector-480.webp 480w,
                          assets/img/rector-640.webp 640w"
                  sizes="(min-width: 768px) 340px, 78vw" />
          <img src="assets/img/rector-480.jpg" class="rector-portrait"
               width="480" height="721" loading="lazy" decoding="async"
               data-i18n-alt="rector.portraitAlt" alt="" />
        </picture>
      </figure>

      <div class="md:col-span-3">
        <p class="eyebrow mb-3" data-i18n="rector.eyebrow"></p>
        <h2 class="text-3xl font-extrabold leading-tight text-white md:text-4xl" data-i18n="rector.title"></h2>
        <div class="rule-gold my-6"></div>

        <div class="rector-quote text-body/90">
          <p data-i18n="rector.p1"></p>
          <p data-i18n="rector.p2"></p>
          <p data-i18n="rector.p3"></p>
        </div>

        <div class="mt-8 border-t border-white/15 pt-5">
          <p class="rector-signature" data-i18n="rector.name"></p>
          <p class="mt-0.5 text-sm text-body/70" data-i18n="rector.role"></p>
        </div>

        <a class="btn-gold mt-8" href="#admissions" data-i18n="rector.cta"></a>
      </div>
    </div>
  </div>
</section>

<!-- ========================= A · ADMISSIONS ========================== -->
<section id="admissions" class="border-b border-line bg-obsidian">
  <div class="mx-auto max-w-content px-5 py-20 md:py-28">
    <p class="eyebrow mb-3" data-i18n="adm.eyebrow"></p>
    <h2 class="text-3xl font-extrabold text-white md:text-4xl" data-i18n="adm.title"></h2>
    <p class="mt-3 max-w-xl text-body/80" data-i18n="adm.lead"></p>

    <div class="mt-10 max-w-2xl">
      <ol class="mb-8 flex items-center gap-2" data-i18n-aria-label="adm.progress">
        <li class="step-dot is-done" data-step="1" data-i18n="adm.step1"></li>
        <li class="step-dot" data-step="2" data-i18n="adm.step2"></li>
        <li class="step-dot" data-step="3" data-i18n="adm.step3"></li>
      </ol>

      <form id="appForm" class="rounded-xl border border-line bg-black p-6 md:p-8" novalidate>

        <!-- Step 1 · Identity -->
        <div class="step-panel is-active" data-panel="1">
          <div class="space-y-5">
            <div>
              <label class="field-label" for="fullName"><span data-i18n="adm.name"></span> <span class="field-req">*</span></label>
              <input class="field-input" id="fullName" name="fullName" type="text" autocomplete="name" data-i18n-placeholder="adm.namePh" />
              <p class="field-error" data-error-for="fullName" data-i18n="adm.nameErr"></p>
            </div>
            <div>
              <label class="field-label" for="email"><span data-i18n="adm.email"></span> <span class="field-req">*</span></label>
              <input class="field-input" id="email" name="email" type="email" autocomplete="email" inputmode="email" data-i18n-placeholder="adm.emailPh" />
              <p class="field-error" data-error-for="email" data-i18n="adm.emailErr"></p>
            </div>
            <div>
              <label class="field-label" for="phone"><span data-i18n="adm.phone"></span> <span class="field-req">*</span></label>
              <input class="field-input" id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" data-i18n-placeholder="adm.phonePh" />
              <p class="field-error" data-error-for="phone" data-i18n="adm.phoneErr"></p>
            </div>
          </div>
        </div>

        <!-- Step 2 · Faculty -->
        <div class="step-panel" data-panel="2">
          <fieldset>
            <legend class="field-label mb-4"><span data-i18n="adm.facultyLegend"></span> <span class="field-req">*</span></legend>
            <div class="grid gap-3">
              <label class="choice-card">
                <input class="mt-1" type="radio" name="faculty" value="Philosophy" />
                <span>
                  <span class="block font-semibold text-white" data-i18n="adm.philTitle"></span>
                  <span class="block text-sm text-muted" data-i18n="adm.philDesc"></span>
                </span>
              </label>
              <label class="choice-card">
                <input class="mt-1" type="radio" name="faculty" value="Science & Tech" />
                <span>
                  <span class="block font-semibold text-white" data-i18n="adm.sciTitle"></span>
                  <span class="block text-sm text-muted" data-i18n="adm.sciDesc"></span>
                </span>
              </label>
              <label class="choice-card">
                <input class="mt-1" type="radio" name="faculty" value="Business" />
                <span>
                  <span class="block font-semibold text-white" data-i18n="adm.bizTitle"></span>
                  <span class="block text-sm text-muted" data-i18n="adm.bizDesc"></span>
                </span>
              </label>
            </div>
            <p class="field-error" data-error-for="faculty" data-i18n="adm.facultyErr"></p>
          </fieldset>
        </div>

        <!-- Step 3 · Documents -->
        <div class="step-panel" data-panel="3">
          <div class="space-y-5">
            <div>
              <span class="field-label">
                <span data-i18n="adm.photo"></span> <span class="field-req">*</span>
                <span class="font-normal text-muted" data-i18n="adm.photoHint"></span>
              </span>
              <label class="dropzone" for="filePhoto">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFD700" stroke-width="1.6" aria-hidden="true">
                  <circle cx="12" cy="9" r="3.2"/><path d="M5 20c1.4-3.2 4-4.6 7-4.6s5.6 1.4 7 4.6"/><rect x="2.8" y="2.8" width="18.4" height="18.4" rx="3"/>
                </svg>
                <span class="text-sm font-medium">
                  <span data-i18n="adm.photoCta"></span> <span class="text-muted" data-i18n="adm.dropHint"></span>
                </span>
                <span class="dz-filename"></span>
                <input id="filePhoto" name="filePhoto" type="file" accept="image/jpeg,image/png" class="sr-only" />
              </label>
              <p class="field-error" data-error-for="filePhoto" data-i18n="adm.photoErr"></p>
            </div>

            <div>
              <span class="field-label">
                <span data-i18n="adm.diploma"></span> <span class="field-req">*</span>
                <span class="font-normal text-muted" data-i18n="adm.diplomaHint"></span>
              </span>
              <label class="dropzone" for="fileDiplome">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFD700" stroke-width="1.6" aria-hidden="true">
                  <path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/>
                </svg>
                <span class="text-sm font-medium">
                  <span data-i18n="adm.diplomaCta"></span> <span class="text-muted" data-i18n="adm.dropHint"></span>
                </span>
                <span class="dz-filename"></span>
                <input id="fileDiplome" name="fileDiplome" type="file" accept="application/pdf,image/jpeg,image/png" class="sr-only" />
              </label>
              <p class="field-error" data-error-for="fileDiplome" data-i18n="adm.diplomaErr"></p>
            </div>
          </div>
        </div>

        <!-- Confirmation -->
        <div class="step-panel" data-panel="4">
          <div class="py-6 text-center">
            <svg class="mx-auto mb-4" width="52" height="52" viewBox="0 0 52 52" fill="none" aria-hidden="true">
              <circle cx="26" cy="26" r="24" stroke="#8B4513" stroke-width="2"/>
              <path d="M16 27l7 7 13-15" stroke="#FFD700" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <h3 class="text-xl font-extrabold text-white" data-i18n="adm.successTitle"></h3>
            <p id="successBody" class="mx-auto mt-2 max-w-sm text-body/80"></p>
          </div>
        </div>

        <div id="wizardControls" class="mt-8 flex items-center justify-between border-t border-line pt-6">
          <button type="button" id="btnBack" class="btn-ghost" data-i18n="adm.back" hidden></button>
          <button type="button" id="btnNext" class="btn-gold ml-auto"></button>
        </div>
      </form>
    </div>
  </div>
</section>

<!-- ========================= B · RESEARCH HUB ======================== -->
<section id="research" class="border-b border-line">
  <div class="mx-auto max-w-content px-5 py-20 md:py-28">
    <p class="eyebrow eyebrow--brown mb-3" data-i18n="res.eyebrow"></p>
    <h2 class="text-3xl font-extrabold text-white md:text-4xl" data-i18n="res.title"></h2>

    <div class="mt-8 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
      <div class="relative w-full md:max-w-sm">
        <svg class="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A8B8C" stroke-width="1.8" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4" stroke-linecap="round"/>
        </svg>
        <input id="researchSearch" type="search" class="field-input field-input--brown !pl-10"
               data-i18n-placeholder="res.searchPh" data-i18n-aria-label="res.searchLabel" />
      </div>
      <div class="flex flex-wrap gap-2" role="group" data-i18n-aria-label="res.filterLabel">
        <button type="button" class="tag-chip" data-tag="health" aria-pressed="false"></button>
        <button type="button" class="tag-chip" data-tag="agri" aria-pressed="false"></button>
        <button type="button" class="tag-chip" data-tag="bioprint" aria-pressed="false"></button>
      </div>
    </div>

    <p id="researchCount" class="mt-6 text-sm text-muted" aria-live="polite"></p>

    <div id="researchGrid" class="mt-4 grid gap-5 sm:grid-cols-2 lg:grid-cols-3"></div>

    <div id="researchEmpty" class="mt-4 rounded-lg border border-line bg-obsidian p-8 text-center" hidden>
      <p class="font-semibold text-white" data-i18n="res.emptyTitle"></p>
      <p class="mt-1 text-sm text-muted" data-i18n="res.emptyBody"></p>
    </div>
  </div>
</section>

<!-- ======================= C · FUNDRAISING =========================== -->
<section id="give" class="relative overflow-hidden bg-obsidian">
  <svg class="pointer-events-none absolute -left-24 bottom-0 h-[420px] w-[420px] opacity-[0.08]" viewBox="0 0 400 400" fill="none" aria-hidden="true">
    <g stroke="#FFD700" stroke-width="1">
      <path d="M60 380V160l140-90 140 90v220M110 380V190M290 380V190M200 380V120M60 240h280M60 300h280"/>
    </g>
  </svg>

  <div class="relative mx-auto max-w-content px-5 py-20 md:py-28">
    <p class="eyebrow mb-3" data-i18n="give.eyebrow"></p>
    <h2 class="max-w-2xl text-3xl font-extrabold text-white md:text-4xl">
      <span data-i18n="give.title"></span> <span class="text-gold" data-i18n="give.titleAccent"></span>
    </h2>
    <p class="mt-4 max-w-2xl text-body/85" data-i18n="give.lead"></p>

    <div class="mt-12 grid gap-10 lg:grid-cols-5">
      <div class="lg:col-span-2">
        <div class="rounded-xl border border-line bg-black p-6">
          <div class="flex items-end justify-between">
            <div>
              <p class="text-sm text-muted" data-i18n="give.raised"></p>
              <p class="text-3xl font-extrabold text-white" id="fundRaisedLabel">$0</p>
            </div>
            <p class="text-sm text-muted"><span data-i18n="give.of"></span> <span class="font-semibold text-body" id="fundTargetLabel">$0</span></p>
          </div>
          <div class="fund-track mt-4" id="fundTrack" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-i18n-aria-label="give.progressLabel">
            <div id="fundBar" class="fund-bar"></div>
          </div>
          <p class="mt-3 text-sm text-muted">
            <span id="fundPct" class="font-semibold text-gold">0%</span> <span data-i18n="give.funded"></span> ·
            <span id="fundDonors">0</span> <span data-i18n="give.benefactors"></span>
          </p>
        </div>
        <ul class="mt-6 space-y-3 text-sm text-body/80">
          <li class="flex gap-3"><span class="mt-1 h-1.5 w-1.5 shrink-0 rounded-full bg-gold"></span><span data-i18n="give.bullet1"></span></li>
          <li class="flex gap-3"><span class="mt-1 h-1.5 w-1.5 shrink-0 rounded-full bg-gold"></span><span data-i18n="give.bullet2"></span></li>
          <li class="flex gap-3"><span class="mt-1 h-1.5 w-1.5 shrink-0 rounded-full bg-gold"></span><span data-i18n="give.bullet3"></span></li>
        </ul>
      </div>

      <form id="donateForm" class="rounded-xl border border-line bg-black p-6 md:p-8 lg:col-span-3" novalidate>
        <h3 class="text-lg font-extrabold text-white" data-i18n="give.formTitle"></h3>

        <div class="mt-5 grid grid-cols-2 gap-3 sm:grid-cols-4" role="group" data-i18n-aria-label="give.amountLegend">
          <button type="button" class="tier-btn" data-amount="50" aria-pressed="false"></button>
          <button type="button" class="tier-btn" data-amount="250" aria-pressed="true"></button>
          <button type="button" class="tier-btn" data-amount="1000" aria-pressed="false"></button>
          <button type="button" class="tier-btn" data-amount="5000" aria-pressed="false"></button>
        </div>

        <div class="mt-3">
          <label class="field-label" for="customAmount" data-i18n="give.customLabel"></label>
          <input id="customAmount" type="number" min="1" step="1" inputmode="numeric" class="field-input" data-i18n-placeholder="give.customPh" />
        </div>

        <fieldset class="mt-6">
          <legend class="field-label mb-3" data-i18n="give.methodLegend"></legend>
          <div class="grid gap-3 sm:grid-cols-2">
            <label class="choice-card items-center">
              <input type="radio" name="payMethod" value="M-Pesa" />
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFD700" stroke-width="1.7" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.4"/><path d="M10 18.5h4"/></svg>
              <span class="font-medium">M-Pesa</span>
            </label>
            <label class="choice-card items-center">
              <input type="radio" name="payMethod" value="Orange Money" />
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E8863A" stroke-width="1.7" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.4"/><path d="M10 18.5h4"/></svg>
              <span class="font-medium">Orange Money</span>
            </label>
            <label class="choice-card items-center">
              <input type="radio" name="payMethod" value="Airtel Money" />
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#EF5B5B" stroke-width="1.7" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.4"/><path d="M10 18.5h4"/></svg>
              <span class="font-medium">Airtel Money</span>
            </label>
            <label class="choice-card items-center">
              <input type="radio" name="payMethod" value="card" checked />
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFD700" stroke-width="1.7" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="2.4"/><path d="M2.5 10h19"/></svg>
              <span class="font-medium" data-i18n="give.card"></span>
            </label>
          </div>
        </fieldset>

        <p class="field-error" data-error-for="donation" data-i18n="give.amountErr"></p>

        <button type="submit" class="btn-gold mt-6 w-full !py-4 text-base"><span id="donateCta"></span></button>
        <p id="donateNote" class="mt-3 text-center text-xs text-muted" aria-live="polite"></p>
      </form>
    </div>
  </div>
